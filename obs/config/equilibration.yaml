# Staged equilibration protocols for each leg, applied to each end state.
# Restraint 'k' is the Sire positional restraint constant, i.e. E = k * r^2.

bound:
  defaults:
    temperature: 298.15 K
    timestep: 2 fs
  stages:
    - {type: minimisation, restraint: heavy, k: 5 kcal mol-1 A-2}
    - {type: dynamics, runtime: 15 ps, timestep: 1 fs, restraint: heavy, k: 5 kcal mol-1 A-2}
    - {type: minimisation, restraint: heavy, k: 2 kcal mol-1 A-2}
    - {type: minimisation, restraint: heavy, k: 0.1 kcal mol-1 A-2}
    - {type: minimisation}
    - {type: dynamics, runtime: 5 ps, timestep: 1 fs, pressure: 1 bar, restraint: heavy, k: 1 kcal mol-1 A-2}
    - {type: dynamics, runtime: 5 ps, timestep: 1 fs, pressure: 1 bar, restraint: heavy, k: 0.5 kcal mol-1 A-2}
    - {type: dynamics, runtime: 10 ps, pressure: 1 bar}
    - {type: dynamics, runtime: 500 ps, pressure: 1 bar}

free:
  defaults:
    temperature: 298.15 K
    timestep: 2 fs
  stages:
    - {type: minimisation, restraint: heavy, k: 5 kcal mol-1 A-2}
    - {type: dynamics, runtime: 15 ps, timestep: 1 fs, restraint: heavy, k: 5 kcal mol-1 A-2}
    - {type: minimisation}
    - {type: dynamics, runtime: 10 ps, pressure: 1 bar}
    - {type: dynamics, runtime: 200 ps, pressure: 1 bar}
