# What to run on Isambard-AI, and how. Environment variables are expanded.

paths:
  # Equilibrated inputs, i.e. the contents of obs_output, laid out as
  # <group>/<system>/{rbfe,abfe}/<name>/.
  input: ${PROJECTDIR}/lester/benchmarks/input
  # Where SOMD2 runs, including checkpoints for restarts.
  scratch: ${SCRATCHDIR}/somd2_benchmarks
  # Where finished legs and their analysis are copied.
  output: ${PROJECTDIR}/lester/benchmarks/output

# Commands run at the start of each job.
setup:
  - module load cuda/12.6
  # nvcc (used by loch for GCMC) doesn't support pixi's GCC, so use the system GCC 13.
  - module load gcc-native/13.2
  - eval "$(pixi shell-hook -e obs --frozen --manifest-path ${PROJECTDIR}/lester/code/sire/pixi.toml)"
  - export NVCC_PREPEND_FLAGS="-ccbin g++-13"

# A leg that becomes unstable is restarted from scratch with this timestep, since
# SOMD2 can't change the timestep on a restart. Set to null to disable.
fallback_timestep: 2 fs

slurm:
  gpus_per_job: 1
  time: "12:00:00"
  # Jobs queued or running at once. Each uses 'gpus_per_job' GPUs, so this also
  # caps the GPUs in use. The QOS allows 256 running and 512 submitted.
  max_jobs: 32
  # Times an unfinished leg is resubmitted (restarting from its checkpoint).
  max_attempts: 3
  extra: []

# Each job submits more legs when it finishes, up to 'max_jobs', so the queue keeps
# itself topped up. Set to false to submit only by running 'benchmarks.py submit'.
top_up: true

# The benchmark set (obs/config/<set>.yaml) and the blocks to run, each with the
# SOMD2 config to use (somd2/<name>.yaml).
set: curated
blocks:
  B: default
  C: default
  P: default
replicates: 3

# Optional: restrict to these systems ("group/system") or edges/ligands
# ("group/system/name").
only:
  # hsp90, where OpenFE does badly, with brd4 as a control.
  - water_set/hsp90_kung
  - water_set/hsp90_woodhead
  - water_set/brd4
  # Charge changes in ptp1b, with tyk2 as a control.
  - charge_annihilation_set/ptp1b
  - charge_annihilation_set/tyk2
  # The systems of block P, whose edges are listed in the set.
  - fragments/liga
  - fragments/p38
  - jacs_set/mcl1
  - mcs_docking_set/hne
  - mcs_docking_set/renin
  - merck/cdk8
  - merck/hif2a
  - merck/pfkfb3
  - merck/shp2
  - merck/syk
  - miscellaneous_set/btk
  - miscellaneous_set/faah
  - miscellaneous_set/hiv1_protease

# The hsp90_kung edges replaced by their _rb versions, which map the vanishing pyrrole
# nitrogen onto the appearing amine.
exclude:
  - water_set/hsp90_kung/cmpd_9~cmpd_7
  - water_set/hsp90_kung/cmpd_9~cmpd_8

# Copy the trajectories to the output directory as well as the energies.
copy_trajectories: false

# Throughput per GPU in ns/day, summed over the windows, for cost estimates. Values
# under 'configs' apply to a SOMD2 config and the configs based on it, and were
# measured on Isambard-AI; the others are the defaults.
throughput:
  bound: 420
  free: 940
  configs:
    matched: {bound: 850, free: 2450}
    all_on: {bound: 550, free: 1700}
    default: {bound: 600, free: 1700}
    abfe: {bound: 800, free: 2350}
    ring_break: {bound: 850, free: 2200}
